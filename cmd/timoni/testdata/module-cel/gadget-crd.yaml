apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.testing.timoni.sh
spec:
  group: testing.timoni.sh
  names:
    kind: Gadget
    listKind: GadgetList
    plural: gadgets
    singular: gadget
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - size
              properties:
                size:
                  type: string
                mode:
                  type: string
                  default: auto
              x-kubernetes-validations:
                - rule: "self.size in ['small', 'large']"
                  message: "size must be one of small or large"
                - rule: "self.size == oldSelf.size"
                  message: "size is immutable"
                - rule: "self.mode != 'off' || self.size == 'small'"
                  message: "mode off requires size small"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
